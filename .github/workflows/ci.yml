name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      # Next.js's ambient route types (LayoutProps, PageProps, etc.) only
      # exist in .next/types after next build/dev/typegen has run at least
      # once. A fresh checkout has no .next/ at all, so tsc fails without
      # this — generate the types first rather than relying on a full build
      # to have run before the typecheck step.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
